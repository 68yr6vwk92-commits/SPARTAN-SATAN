
name: Bootstrap Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter project
        run: |
          flutter create --org com.spartansatan spartan_satan

      - name: Copy project files
        run: |
          rsync -a --exclude='.git' spartan_satan/ ./

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize SPARTAN SATAN Flutter project" || echo "No changes"
          git push
